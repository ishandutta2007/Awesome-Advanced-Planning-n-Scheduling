<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>
    
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Gantt Bar Gradients -->
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    /* Subtle background animations (non-blocking behind text) */
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes slide {
      0% { transform: translateX(0px); }
      50% { transform: translateX(15px); }
      100% { transform: translateX(0px); }
    }
    .anim-pulse { animation: pulse 6s infinite ease-in-out; transform-origin: center; }
    .anim-slide { animation: slide 4s infinite ease-in-out; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/>

  <!-- Background Dynamic Geometric Elements -->
  <circle cx="150" cy="80" r="180" fill="url(#accentPurple)" class="anim-pulse" filter="blur(40px)"/>
  <circle cx="1050" cy="220" r="200" fill="url(#accentCyan)" class="anim-pulse" filter="blur(50px)"/>

  <!-- Decorative Tech Grid (Background) -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="500" y1="0" x2="500" y2="300"/>
    <line x1="700" y1="0" x2="700" y2="300"/>
    <line x1="900" y1="0" x2="900" y2="300"/>
    <line x1="1100" y1="0" x2="1100" y2="300"/>
  </g>

  <!-- Dynamic Gantt Chart Visual (Decorative Side Element) -->
  <g transform="translate(820, 60)" opacity="0.45" class="anim-slide">
    <rect x="0" y="0" width="300" height="180" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Gantt Lines -->
    <rect x="20" y="30" width="120" height="18" rx="9" fill="url(#bar1)"/>
    <rect x="150" y="30" width="110" height="18" rx="9" fill="url(#bar2)"/>
    
    <rect x="20" y="70" width="80" height="18" rx="9" fill="url(#bar3)"/>
    <rect x="110" y="70" width="150" height="18" rx="9" fill="url(#bar1)"/>
    
    <rect x="20" y="110" width="160" height="18" rx="9" fill="url(#bar2)"/>
    <rect x="190" y="110" width="80" height="18" rx="9" fill="url(#bar3)"/>
    
    <!-- Timeline marker line -->
    <line x1="140" y1="15" x2="140" y2="165" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4"/>
  </g>

  <!-- Foreground Content (Always clear & unobstructed) -->
  <g transform="translate(70, 0)">
    <!-- Pill Tag -->
    <g transform="translate(0, 55)">
      <rect x="0" y="0" width="320" height="30" rx="15" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
      <text x="15" y="20" class="badge">⚡ PRODUCTION &amp; CAPACITY OPTIMIZATION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" class="title">Awesome Advanced Planning &amp; Scheduling</text>

    <!-- Subtitle -->
    <text x="0" y="182" class="subtitle">A curated ecosystem of enterprise SaaS APS platforms &amp; open-source constraint solvers</text>
    
    <!-- Feature Chips -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="160" height="28" rx="6" fill="#334155" opacity="0.8"/>
      <text x="12" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">🏭 Finite Capacity</text>

      <rect x="175" y="0" width="150" height="28" rx="6" fill="#334155" opacity="0.8"/>
      <text x="187" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">⚙️ Job Shop (JSSP)</text>

      <rect x="340" y="0" width="170" height="28" rx="6" fill="#334155" opacity="0.8"/>
      <text x="352" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">🧮 Constraint Solvers</text>
    </g>
  </g>
</svg>
